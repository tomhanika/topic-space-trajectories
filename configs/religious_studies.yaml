# OpenAlex: Religious studies.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: religious_studies
workdir: ../runs/religious_studies
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [1212]
  min_year: 1960
preprocess:
  min_tokens: 20
  # Junk of this map only (topic review 2026-11-10, counts checked with scripts/pattern_hits.py on
  # 2026-11-15); see export.notes.
  extra_drop_patterns:
    "Repository deposit records instead of an abstract":
      - '^[^\n]*\n\s*(?:submitted by|made available in dspace|approved for entry into archive by)\b'
    "Church newsletters and sermon archives":
      - 'newsletter (?:from|of) [^\n]{0,80}\bchurch\b'
      - '[''’]s sermon, [^\n]{1,200}\bthis sermon\b'
      - '\bthis sermon [^\n]{0,200}\bwas preached (?:on )?sunday\b'
    # Second round (2026-11-16): the retrained map still had a topic of church periodicals and records (3.9k).
    "Church periodicals, web pages and records":
      - '^herald of holiness volume \d+'
      - '^evangelical friend, [a-z]+ \d{4}'
      - '^preacher[''’]s magazine volume \d+'
      - '^indiana apostolic trumpet\b'
      - '\| the foursquare church\s*\n'
      - '^[^\n]{0,100}\bchurch\b[^\n]{0,80}\bminutes,? \d{4}'
      - '^minutes and notes, \d{4}'
      - '^w\d{2}-\d{4}\.\d+\. '
      - '^[^\n]{1,200}\((?:audio|video)\)\s*\n'
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 2, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Religious studies"
  group: "Arts and Humanities"
  labels_file: labels/religious_studies.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    preprocess.extra_drop_patterns: "Records that are not research, found when the topics of this map were named (November 2026): Repository deposit records instead of an abstract; Church newsletters and sermon archives; Church periodicals, web pages and records. They are dropped in the maps where they are frequent (at least 0.1 % of the papers, or a topic of their own); elsewhere a few remain."
    input.openalex.subfields: "From Arts and Humanities: Religious studies."
    trajectories.entities.author: "2 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
