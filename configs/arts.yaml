# OpenAlex: Visual and performing arts, music.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: arts
workdir: ../runs/arts
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [1213, 1210]
  min_year: 1960
preprocess:
  min_tokens: 20
  # Junk of this map only (topic review 2026-11-10, counts checked with scripts/pattern_hits.py on
  # 2026-11-15); see export.notes.
  extra_drop_patterns:
    "Repository deposit records instead of an abstract":
      - '^[^\n]*\n\s*(?:submitted by|made available in dspace|approved for entry into archive by)\b'
    "ACM Digital Library page text":
      - '\bauthors? info (?:&|and) claims\b'
      - 'new citation alert added'
    "Publisher preview pages":
      - '/docserver/preview/fulltext/'
      - '^[^\n]*\n\s*preview this article:'
    "Conference front matter instead of an abstract":
      - '^[^\n]*\n\s*appears in: [a-z]+\d{2} proceedings'
    "Concert and recital programmes":
      - 'this recital is presented in partial fulfillment'
      - '\bincludes program notes\b'
      - '^[^\n]*\b(?:senior|junior|graduate|degree|faculty|student|doctoral|artist diploma|master''?s|chamber music|guest artist) recital\b'
      - '^[^\n]*\n\s*program: [^\n]{0,400} / [^\n]{1,80} --'
      - 'includes a list of upcoming [^\n]{0,60}\bevents\b'
      - '^[^\n]*\n\s*this is the program for\b'
      - 'school of music \[?presents\b'
    "Student newspapers":
      - '^[^\n]*\n[^\n]{0,150}\b(?:student|campus) newspaper\b'
      - '^the georgia state university signal\b'
      - '^columbia chronicle \('
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 2, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Arts and music"
  group: "Arts and Humanities"
  labels_file: labels/arts.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    preprocess.extra_drop_patterns: "Records that are not research, found when the topics of this map were named (November 2026): Repository deposit records instead of an abstract; ACM Digital Library page text; Publisher preview pages; Conference front matter instead of an abstract; Concert and recital programmes; Student newspapers. They are dropped in the maps where they are frequent (at least 0.1 % of the papers, or a topic of their own); elsewhere a few remain."
    input.openalex.subfields: "From Arts and Humanities: Visual Arts and Performing Arts; Music."
    trajectories.entities.author: "2 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
