# OpenAlex: Sociology (3312 Sociology and Political Science), anthropology, demography, gender and cultural studies,
# life-course studies and general social sciences.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: sociology
workdir: ../runs/sociology
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [3312, 3314, 3317, 3318, 3316, 3319, 3300]
  min_year: 1960
preprocess:
  min_tokens: 20
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 3, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Sociology and anthropology"
  group: "Social Sciences"
  labels_file: labels/sociology.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    input.openalex.subfields: "Sociology and Political Science (3312), Anthropology, Demography, Gender Studies, Cultural Studies, Life-span and Life-course Studies and General Social Sciences (the last two added on 2026-11-07, when the maps were extended to all of OpenAlex)."
    trajectories.entities.author: "3 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
