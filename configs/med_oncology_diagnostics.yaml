# OpenAlex: Medicine, part 5: oncology, imaging, pathology, hematology and genetics.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: med_oncology_diagnostics
workdir: ../runs/med_oncology_diagnostics
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [2730, 2741, 2734, 2720, 2716]
  min_year: 1960
preprocess:
  min_tokens: 20
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 4, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Medicine: oncology and diagnostics"
  group: "Health Sciences"
  labels_file: labels/med_oncology_diagnostics.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    input.openalex.subfields: "Medicine (field 27) is split into seven maps; Psychiatry and Mental Health and Neurology are in the neuroscience map; part 5: Oncology; Radiology, Nuclear Medicine and Imaging; Pathology and Forensic Medicine; Hematology; Genetics."
    trajectories.entities.author: "4 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
