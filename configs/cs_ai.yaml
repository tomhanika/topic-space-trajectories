# OpenAlex: Computer science, part 1: artificial intelligence and computer vision.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: cs_ai
workdir: ../runs/cs_ai
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [1702, 1707]
  min_year: 1960
preprocess:
  min_tokens: 20
  # Junk of this map only (topic review 2026-11-10, counts checked with scripts/pattern_hits.py on
  # 2026-11-15); see export.notes.
  extra_drop_patterns:
    "Repository deposit records instead of an abstract":
      - '^[^\n]*\n\s*(?:submitted by|made available in dspace|approved for entry into archive by)\b'
    "ACM Digital Library page text":
      - '\bauthors? info (?:&|and) claims\b'
      - 'new citation alert added'
    "Publisher preview pages":
      - '/docserver/preview/fulltext/'
      - '^[^\n]*\n\s*preview this article:'
    "Conference front matter instead of an abstract":
      - '^[^\n]*\n\s*appears in: [a-z]+\d{2} proceedings'
    # Second round (2026-11-16), found when the retrained map was named: 8.7k ACL Anthology records whose
    # abstract is only the authors and the proceedings (a topic of their own), and 9.2k cloned 2026 records.
    "ACL Anthology citations instead of an abstract":
      - '^[^\n]*\n[^\n]{0,600}?\.\s*(?:proceedings of|findings of)[^\n]{0,300}?(?:computational linguistics|language processing|language technologies)[^\n]{0,200}?\b(?:19|20)\d\d\.?\s*$'
    "Machine-generated reports":
      - 'autonomous synthesis report generated by'
      - 'tribunal consensus score'
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 4, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Computer science: AI and vision"
  group: "Engineering and Computer Science"
  labels_file: labels/cs_ai.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    preprocess.extra_drop_patterns: "Records that are not research or carry no abstract of their own, found when the topics of this map were named (November 2026): Repository deposit records instead of an abstract; ACM Digital Library page text; Publisher preview pages; Conference front matter instead of an abstract; ACL Anthology citations instead of an abstract; Machine-generated reports (cloned abstracts dated 2026). They are dropped in the maps where they are frequent (at least 0.1 % of the papers, or a topic of their own); elsewhere a few remain."
    input.openalex.subfields: "Computer Science (field 17) is split into four maps; part 1: Artificial Intelligence; Computer Vision and Pattern Recognition."
    trajectories.entities.author: "4 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
