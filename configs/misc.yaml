# OpenAlex: Works without an OpenAlex topic.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: misc
workdir: ../runs/misc
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    fields: [0]
  min_year: 1960
preprocess:
  min_tokens: 20
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 3, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Works without an OpenAlex topic"
  group: "Unclassified"
  # Not in the web app: all of its topics turned out to be junk (spam, report boilerplate, front matter, campus
  # news), no research (naming review, 2026-11-10). The run stays on disk for reference.
  publish: false
  labels_file: labels/misc.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    input.openalex.fields: "Works that OpenAlex has given no primary topic (field 0 in configs/openalex_subfields.csv, about 1 % of the works with an abstract); they come from all disciplines."
    trajectories.entities.author: "3 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
