# OpenAlex: Biology: biochemistry, genetics, molecular biology (field 13), immunology and microbiology (field 24), ecology/evolution, zoology, insects, aquatic science.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: biology
workdir: ../runs/biology
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    fields: [13, 24]
    subfields: [1105, 1103, 1109, 1104]
  min_year: 1960
preprocess:
  min_tokens: 20
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k: 64                            # see export.notes
  k_grid: [24, 32, 40, 48, 56, 64, 80, 96, 112, 128]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 4, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Biology"
  group: "Life Sciences"
  labels_file: labels/biology.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    input.openalex.fields: "Fields 13 (Biochemistry, Genetics and Molecular Biology) and 24 (Immunology and Microbiology), plus four subfields of field 11 (Agricultural and Biological Sciences): Ecology, Evolution, Behavior and Systematics; Animal Science and Zoology; Insect Science; Aquatic Science."
    topics.k_grid: "Extended by 96, 112 and 128 on 2026-11-05: with the curated vocabulary the main resolution chose k = 80, the largest k of the earlier grid (24–80), which left no larger k for the fine resolution."
    topics.k: "Set to 64 on 2026-11-08. The automatic choice (the most coherent stable k) took 128, the largest k of the grid, which left none for the fine resolution; coherence is almost flat from k = 40 on (NPMI 0.264 at 40, 0.266 at 64, 0.269 at 128) while the least coherent topic drops from 0.09 at 64 to 0.03 at 128. 64 and 128 are both stable (0.73, 0.71) and give the main and fine maps."
    trajectories.entities.author: "4 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
