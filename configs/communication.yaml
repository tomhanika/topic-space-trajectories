# OpenAlex: Communication and library and information sciences.
# Ids: configs/openalex_subfields.csv. Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: communication
workdir: ../runs/communication
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [3315, 3309]
  min_year: 1960
preprocess:
  min_tokens: 20
  # Junk of this map only (topic review 2026-11-10, counts checked with scripts/pattern_hits.py on
  # 2026-11-15); see export.notes.
  extra_drop_patterns:
    "Repository deposit records instead of an abstract":
      - '^[^\n]*\n\s*(?:submitted by|made available in dspace|approved for entry into archive by)\b'
    "ACM Digital Library page text":
      - '\bauthors? info (?:&|and) claims\b'
      - 'new citation alert added'
    "Publisher preview pages":
      - '/docserver/preview/fulltext/'
      - '^[^\n]*\n\s*preview this article:'
    "Conference front matter instead of an abstract":
      - '^[^\n]*\n\s*appears in: [a-z]+\d{2} proceedings'
    "Student newspapers":
      - '^[^\n]*\n[^\n]{0,150}\b(?:student|campus) newspaper\b'
      - '^the georgia state university signal\b'
      - '^columbia chronicle \('
      # Second round (2026-11-16): the retrained map still had a student-newspaper topic (1.3k issues).
      - '^(?:the )?(?:georgia state (?:college |university )?)?signal,? \d{4}-\d{2}-\d{2}\s*\n'
      - '^the courier, volume \d+, issue \d+'
      - '^iowa state daily \('
      - '^the buchtelite\b'
      - '^central florida future\b'
vectorize:
  min_df: 50
  max_df: 0.4
  max_features: 60000
topics:
  k_grid: [24, 32, 40, 48, 56, 64, 80]
  runs: 3
  train_sample: 400000
trajectories:
  entities:
    venue: {min_papers: 20, window: 3, smoothing: pooled}
    author: {min_papers: 2, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 300}
projection:
  fit_sample: 200000
  doc_sample: 1000000
network:
  min_author_papers: 10
  window: 3
export:
  label: "Communication and information science"
  group: "Social Sciences"
  labels_file: labels/communication.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    preprocess.extra_drop_patterns: "Records that are not research, found when the topics of this map were named (November 2026): Repository deposit records instead of an abstract; ACM Digital Library page text; Publisher preview pages; Conference front matter instead of an abstract; Student newspapers. They are dropped in the maps where they are frequent (at least 0.1 % of the papers, or a topic of their own); elsewhere a few remain."
    input.openalex.subfields: "From Social Sciences: Communication; Library and Information Sciences."
    trajectories.entities.author: "2 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
