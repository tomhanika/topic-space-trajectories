# Philosophy from OpenAlex (subfield 1211).
# Needs the store next to the repository folder: tst openalex-fetch ../openalex
name: philosophy
workdir: ../runs/philosophy
input:
  path: ../../openalex                # relative to this file, i.e. <repository>/../openalex
  format: openalex
  openalex:
    subfields: [1211]
  min_year: 1960
preprocess:
  min_tokens: 20
  # Junk of this map only (topic review 2026-11-10, counts checked with scripts/pattern_hits.py on
  # 2026-11-15); see export.notes.
  extra_drop_patterns:
    "Repository deposit records instead of an abstract":
      - '^[^\n]*\n\s*(?:submitted by|made available in dspace|approved for entry into archive by)\b'
    "Publisher preview pages":
      - '/docserver/preview/fulltext/'
      - '^[^\n]*\n\s*preview this article:'
vectorize:
  min_df: 20
  max_df: 0.4
  max_features: 50000
topics:
  k_grid: [16, 20, 24, 28, 32, 40]
  runs: 3
  train_sample: 300000
trajectories:
  entities:
    venue: {min_papers: 10, window: 3, smoothing: pooled}
    author: {min_papers: 2, window: 3, smoothing: pooled, min_years: 3}
  pairwise: {entity_type: venue, max_entities: 200}
projection:
  fit_sample: 150000
  doc_sample: 1000000
network:
  min_author_papers: 5
  window: 3
export:
  label: "Philosophy"
  group: "Arts and Humanities"
  labels_file: labels/philosophy.tsv          # topic names (tst.topics.model.read_labels)
  max_docs: 200000
  url_template: "https://openalex.org/{source_id}"
  notes:                           # why this corpus differs from the defaults; shown in the bundle
    preprocess.extra_drop_patterns: "Records that are not research, found when the topics of this map were named (November 2026): Repository deposit records instead of an abstract; Publisher preview pages. They are dropped in the maps where they are frequent (at least 0.1 % of the papers, or a topic of their own); elsewhere a few remain."
    input.openalex.subfields: "Subfield 1211 Philosophy (Arts and Humanities)."
    vectorize.min_df: "A smaller corpus than the other fields (about 0.5 million English abstracts): words in at least 20 papers, a vocabulary of at most 50,000 words."
    topics.k_grid: "Fewer and smaller candidates (16–40) because the corpus is smaller."
    trajectories.entities.author: "2 papers a year: about the 95th percentile of papers per author and year in this field."
fine:
  enabled: true                    # second, finer topic resolution in <workdir>/fine
