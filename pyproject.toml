[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-space-trajectories"
version = "0.1.0"
description = "Pipeline for topic models, topic space trajectories and topic collaboration graphs of document corpora."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tom Hanika" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "joblib>=1.3",
    "threadpoolctl>=3",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "umap-learn>=0.5.5",
    "python-igraph>=0.11",
]

[project.urls]
Homepage = "https://github.com/tomhanika/topic-space-trajectories"
Documentation = "https://github.com/tomhanika/topic-space-trajectories/blob/main/docs/MANUAL.md"

[project.optional-dependencies]
tsne = ["openTSNE>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
tst = "tst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tst.topics" = ["academic_stopwords.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
