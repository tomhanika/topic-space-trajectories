"Irish parliamentary questions":
  - '^pq-\d+-\d+ - '
  - '\bdeputy [^\n.]{1,60} asked the (minister|taoiseach|t[aá]naiste)\b'
"Court briefs":
  - '^[^\n]{1,600}\bvs?\.? [^\n]{1,600}:\s*(?:[\w''/-]+ ){0,4}brief(?: of [^\n]{1,80})?\s*\n'
  - '^[^\n]{1,600}\bvs?\.? [^\n]{1,600}:\s*(?:petition for rehearing|petition for (?:a )?writ of certiorari|response to petition for rehearing|docketing statement|addendum|answer to petition[^\n]*)\s*\n'
  - '^in the matter of [^\n]{1,600}:\s*(?:[\w''/-]+ ){0,4}brief(?: of [^\n]{1,80})?\s*\n'
  - '^[^\n]*\n\s*(?:an |on )?appeal (?:taken )?from\b[^\n]{0,400}\bhonorable\b'
"Repository deposit records instead of an abstract":
  - '^[^\n]*\n\s*(?:submitted by|made available in dspace|approved for entry into archive by)\b'
"ACM Digital Library page text":
  - '\bauthors? info (?:&|and) claims\b'
  - 'new citation alert added'
"Publisher preview pages":
  - '/docserver/preview/fulltext/'
  - '^[^\n]*\n\s*preview this article:'
"Conference front matter instead of an abstract":
  - '^[^\n]*\n\s*appears in: [a-z]+\d{2} proceedings'
"Concert and recital programmes":
  - 'this recital is presented in partial fulfillment'
  - '\bincludes program notes\b'
  - '^[^\n]*\b(?:senior|junior|graduate|degree|faculty|student|doctoral|artist diploma|master''?s|chamber music|guest artist) recital\b'
  - '^[^\n]*\n\s*program: [^\n]{0,400} / [^\n]{1,80} --'
  - 'includes a list of upcoming [^\n]{0,60}\bevents\b'
  - '^[^\n]*\n\s*this is the program for\b'
  - 'school of music \[?presents\b'
"Student newspapers":
  - '^[^\n]*\n[^\n]{0,150}\b(?:student|campus) newspaper\b'
  - '^the georgia state university signal\b'
  - '^columbia chronicle \('
"Church newsletters and sermon archives":
  - 'newsletter (?:from|of) [^\n]{0,80}\bchurch\b'
  - '[''’]s sermon, [^\n]{1,200}\bthis sermon\b'
  - '\bthis sermon [^\n]{0,200}\bwas preached (?:on )?sunday\b'
"Software manual pages":
  - '\bnag (?:c |fortran |parallel )?library (?:routine|function) document\b'
  - 'please read the users ?[''’]? ?note for your implementation'
# Second round (2026-11-16), from the naming of the retrained maps; dropped in cs_ai only (elsewhere < 0.1 %).
"ACL Anthology citations instead of an abstract":
  - '^[^\n]*\n[^\n]{0,600}?\.\s*(?:proceedings of|findings of)[^\n]{0,300}?(?:computational linguistics|language processing|language technologies)[^\n]{0,200}?\b(?:19|20)\d\d\.?\s*$'
"Machine-generated reports":
  - 'autonomous synthesis report generated by'
  - 'tribunal consensus score'
# Second round, communication only: student-newspaper issues the first patterns missed (added to "Student newspapers").
"Student newspapers (second round)":
  - '^(?:the )?(?:georgia state (?:college |university )?)?signal,? \d{4}-\d{2}-\d{2}\s*\n'
  - '^the courier, volume \d+, issue \d+'
  - '^iowa state daily \('
  - '^the buchtelite\b'
  - '^central florida future\b'
# Second round, religious_studies only.
"Church periodicals, web pages and records":
  - '^herald of holiness volume \d+'
  - '^evangelical friend, [a-z]+ \d{4}'
  - '^preacher[''’]s magazine volume \d+'
  - '^indiana apostolic trumpet\b'
  - '\| the foursquare church\s*\n'
  - '^[^\n]{0,100}\bchurch\b[^\n]{0,80}\bminutes,? \d{4}'
  - '^minutes and notes, \d{4}'
  - '^w\d{2}-\d{4}\.\d+\. '
  - '^[^\n]{1,200}\((?:audio|video)\)\s*\n'
